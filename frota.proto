syntax = "proto3";

package frota;

// Mensagem de localização do veículo (enviada em stream)
message Localizacao {
  string veiculo_id = 1;
  double latitude = 2;
  double longitude = 3;
  string timestamp = 4;
  int32 velocidade = 5;
}

// Comando enviado do servidor para o veículo
message Comando {
  string veiculo_id = 1;
  string tipo = 2;
  string mensagem = 3;
  int32 prioridade = 4;
}

// Requisição para consultar um veículo específico
message VeiculoRequest {
  string veiculo_id = 1;
}

// Requisição de estimativa de entrega
message EntregaRequest {
  string veiculo_id = 1;
}

// Resposta da estimativa de entrega
message EntregaResponse {
  string tempo_estimado = 1;
  string condicoes = 2;
  string status = 3;
}

// Serviço principal
service FrotaService {
  // Comunicação bidirecional (stream de localizações e comandos)
  rpc Comunicar (stream Localizacao) returns (stream Comando);

  // Consulta única à localização de um veículo
  rpc ConsultarVeiculo (VeiculoRequest) returns (Localizacao);

  // Solicita estimativa de entrega
  rpc EstimarEntrega (EntregaRequest) returns (EntregaResponse);
}
